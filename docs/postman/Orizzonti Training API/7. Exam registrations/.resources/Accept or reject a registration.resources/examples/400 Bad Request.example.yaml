$kind: http-example
request:
  url: "{{apiBaseUrl}}/exam-registrations/{{examRegistrationId}}"
  method: PATCH
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "accepted"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": [
          "status must be one of the following values: pending, accepted, rejected"
        ],
        "error": "Bad Request",
        "statusCode": 400
      }
order: 4000

$kind: http-example
request:
  url: "{{apiBaseUrl}}/exam-registrations/{{examRegistrationId}}"
  method: PATCH
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "accepted"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": "No places left for this exam",
        "error": "Conflict",
        "statusCode": 409
      }
order: 2000

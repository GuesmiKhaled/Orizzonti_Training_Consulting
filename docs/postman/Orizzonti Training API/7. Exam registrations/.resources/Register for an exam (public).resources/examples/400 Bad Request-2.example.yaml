$kind: http-example
name: 400 Bad Request
auth:
  type: noauth
request:
  url: "{{apiBaseUrl}}/languages/{{languageId}}/levels/{{languageLevelId}}/exams/{{examSessionId}}/register"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "fullName": "Postman Applicant",
        "email": "applicant@example.com",
        "phone": "+216 22 222 222",
        "message": "Looking forward to it"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": [
          "email must be an email"
        ],
        "error": "Bad Request",
        "statusCode": 400
      }
order: 6000

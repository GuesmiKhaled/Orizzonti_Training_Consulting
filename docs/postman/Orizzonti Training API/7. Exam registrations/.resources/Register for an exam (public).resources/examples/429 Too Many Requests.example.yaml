$kind: http-example
auth:
  type: noauth
request:
  url: "{{apiBaseUrl}}/languages/{{languageId}}/levels/{{languageLevelId}}/exams/{{examSessionId}}/register"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "fullName": "Postman Applicant",
        "email": "applicant@example.com",
        "phone": "+216 22 222 222",
        "message": "Looking forward to it"
      }
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    Content-Type: application/json; charset=utf-8
    Retry-After: "60"
  body:
    type: json
    content: |-
      {
        "statusCode": 429,
        "message": "ThrottlerException: Too Many Requests"
      }
order: 7000

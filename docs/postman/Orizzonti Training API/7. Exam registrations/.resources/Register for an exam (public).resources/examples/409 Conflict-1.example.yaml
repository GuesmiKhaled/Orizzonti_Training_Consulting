$kind: http-example
name: 409 Conflict
auth:
  type: noauth
request:
  url: "{{apiBaseUrl}}/languages/{{languageId}}/levels/{{languageLevelId}}/exams/{{examSessionId}}/register"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "fullName": "Postman Applicant",
        "email": "applicant@example.com",
        "phone": "+216 22 222 222",
        "message": "Looking forward to it"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": "No places left for this exam",
        "error": "Conflict",
        "statusCode": 409
      }
order: 3000

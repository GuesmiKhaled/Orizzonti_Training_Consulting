$kind: http-request
description: "`imageUrl` must be an image from the site library, for example `/img/cat-1.jpg` (no external URLs, no `..`)."
url: "{{apiBaseUrl}}/languages"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Postman language",
      "code": "PML",
      "nativeName": "Postman",
      "imageUrl": "/img/cat-1.jpg",
      "isActive": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      const json = pm.response.json();
      pm.collectionVariables.set("languageId", json.id);
    language: text/javascript
examples: ./.resources/Create language (saves languageId).resources/examples
order: 3000

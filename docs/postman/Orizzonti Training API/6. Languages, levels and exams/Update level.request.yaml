$kind: http-request
url: "{{apiBaseUrl}}/languages/{{languageId}}/levels/{{languageLevelId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "price": "800"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
examples: ./.resources/Update level.resources/examples
order: 9000

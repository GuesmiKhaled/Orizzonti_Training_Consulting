$kind: http-request
description: Send `null` for `maxParticipants`, `location`, `price`, `courseHours` or `subscriptionUrl` to clear them.
url: "{{apiBaseUrl}}/languages/{{languageId}}/levels/{{languageLevelId}}/exams/{{examSessionId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "maxParticipants": 25,
      "location": "Sfax"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
examples: ./.resources/Update exam session.resources/examples
order: 13000

$kind: http-example
name: 400 Bad Request
request:
  url: "{{apiBaseUrl}}/languages/{{languageId}}/levels/{{languageLevelId}}/exams"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "examDate": "2026-12-10T09:00:00.000Z",
        "registrationStartDate": "2026-11-01T09:00:00.000Z",
        "registrationDeadline": "2026-11-30T09:00:00.000Z",
        "location": "Tunis",
        "maxParticipants": 20
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": "Registration start date must be before registration deadline",
        "error": "Bad Request",
        "statusCode": 400
      }
order: 3000

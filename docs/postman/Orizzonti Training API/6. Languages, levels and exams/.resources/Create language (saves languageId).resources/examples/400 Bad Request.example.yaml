$kind: http-example
request:
  url: "{{apiBaseUrl}}/languages"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "name": "Postman language",
        "code": "PML",
        "nativeName": "Postman",
        "imageUrl": "/img/cat-1.jpg",
        "isActive": true
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": [
          "imageUrl must be an image from the library, for example /img/cat-1.jpg"
        ],
        "error": "Bad Request",
        "statusCode": 400
      }
order: 2000

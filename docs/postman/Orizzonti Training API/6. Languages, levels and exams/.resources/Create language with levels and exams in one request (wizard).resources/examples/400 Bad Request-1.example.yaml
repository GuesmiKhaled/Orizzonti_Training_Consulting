$kind: http-example
name: 400 Bad Request
request:
  url: "{{apiBaseUrl}}/languages/wizard"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "language": {
          "name": "Wizard language",
          "code": "WZD",
          "nativeName": "Wizard",
          "imageUrl": "/img/eng/english.jpg",
          "isActive": true
        },
        "levels": [
          {
            "cefrLevel": "A1",
            "courseHours": "120",
            "price": "500",
            "isActive": true,
            "exams": [
              {
                "examDate": "2026-12-10T09:00:00.000Z",
                "registrationStartDate": "2026-11-01T09:00:00.000Z",
                "registrationDeadline": "2026-11-30T09:00:00.000Z",
                "location": "Tunis",
                "maxParticipants": 20
              }
            ]
          }
        ]
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": "Registration deadline must be before exam date",
        "error": "Bad Request",
        "statusCode": 400
      }
order: 3000

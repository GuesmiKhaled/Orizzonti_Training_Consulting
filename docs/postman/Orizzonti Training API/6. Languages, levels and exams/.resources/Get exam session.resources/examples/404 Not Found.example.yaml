$kind: http-example
auth:
  type: noauth
request:
  url: "{{apiBaseUrl}}/languages/{{languageId}}/levels/{{languageLevelId}}/exams/{{examSessionId}}"
  method: GET
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": "Exam session not found",
        "error": "Not Found",
        "statusCode": 404
      }
order: 2000

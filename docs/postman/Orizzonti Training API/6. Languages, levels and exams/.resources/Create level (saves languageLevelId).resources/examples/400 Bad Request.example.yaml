$kind: http-example
request:
  url: "{{apiBaseUrl}}/languages/{{languageId}}/levels"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "cefrLevel": "B1",
        "courseHours": "350",
        "price": "750",
        "isActive": true
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": [
          "cefrLevel must be one of the following values: A1, A2, B1, B2, C1, C2",
          "price must be a string"
        ],
        "error": "Bad Request",
        "statusCode": 400
      }
order: 2000

$kind: http-example
request:
  url: "{{apiBaseUrl}}/languages/{{languageId}}"
  method: PATCH
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "nativeName": "Postman (edited)",
        "imageUrl": "/img/cat-3.jpg"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": [
          "property id should not exist"
        ],
        "error": "Bad Request",
        "statusCode": 400
      }
order: 3000

$kind: http-example
request:
  url: "{{apiBaseUrl}}/languages/{{languageId}}"
  method: PATCH
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "nativeName": "Postman (edited)",
        "imageUrl": "/img/cat-3.jpg"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": "Language not found",
        "error": "Not Found",
        "statusCode": 404
      }
order: 2000

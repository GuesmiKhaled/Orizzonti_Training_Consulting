$kind: http-request
url: "{{apiBaseUrl}}/languages/{{languageId}}"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
examples: ./.resources/Get language (public).resources/examples
order: 2000

$kind: http-request
description: Each exam includes `placesLeft`, `isBookable` and `bookingStatus`. `imageUrl` is the language picture (a path from the site image library) or null.
url: "{{apiBaseUrl}}/languages"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
examples: ./.resources/List languages with levels and exams (public).resources/examples
order: 1000

$kind: http-request
url: "{{apiBaseUrl}}/courses"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Postman course",
      "level": "B1",
      "price": "450",
      "startDate": "2026-11-02",
      "description": "Created from Postman",
      "imageUrl": "/img/cat-2.jpg"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      const json = pm.response.json();
      pm.collectionVariables.set("courseId", json.id);
    language: text/javascript
examples: ./.resources/Create course (saves courseId).resources/examples
order: 4000

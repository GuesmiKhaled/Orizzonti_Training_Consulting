$kind: http-request
description: "Send `imageUrl: null` to remove the picture."
url: "{{apiBaseUrl}}/courses/{{courseId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "price": "480",
      "imageUrl": null
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
examples: ./.resources/Update course.resources/examples
order: 5000

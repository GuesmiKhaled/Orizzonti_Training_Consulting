$kind: http-example
request:
  url: "{{apiBaseUrl}}/courses/{{courseId}}"
  method: PATCH
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "price": "480",
        "imageUrl": null
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": "Course not found",
        "error": "Not Found",
        "statusCode": 404
      }
order: 2000

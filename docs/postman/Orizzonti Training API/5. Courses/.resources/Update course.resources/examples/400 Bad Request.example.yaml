$kind: http-example
request:
  url: "{{apiBaseUrl}}/courses/{{courseId}}"
  method: PATCH
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "price": "480",
        "imageUrl": null
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": [
          "property id should not exist"
        ],
        "error": "Bad Request",
        "statusCode": 400
      }
order: 3000

$kind: http-example
auth:
  type: noauth
request:
  url: "{{apiBaseUrl}}/auth/refresh"
  method: POST
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "user": {
          "id": 1,
          "username": "admin",
          "permissions": ["manage_users", "manage_blog"],
          "mustChangePassword": false
        }
      }
order: 1000

$kind: http-example
auth:
  type: noauth
request:
  url: "{{apiBaseUrl}}/auth/login"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "username": "{{adminUser}}",
        "password": "{{adminPassword}}"
      }
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    Content-Type: application/json; charset=utf-8
    Retry-After: "60"
  body:
    type: json
    content: |-
      {
        "statusCode": 429,
        "message": "ThrottlerException: Too Many Requests"
      }
order: 5000

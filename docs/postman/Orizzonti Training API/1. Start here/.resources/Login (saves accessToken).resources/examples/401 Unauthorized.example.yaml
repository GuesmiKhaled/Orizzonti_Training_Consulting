$kind: http-example
auth:
  type: noauth
request:
  url: "{{apiBaseUrl}}/auth/login"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "username": "{{adminUser}}",
        "password": "{{adminPassword}}"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": "Invalid username or password",
        "error": "Unauthorized",
        "statusCode": 401
      }
order: 3000

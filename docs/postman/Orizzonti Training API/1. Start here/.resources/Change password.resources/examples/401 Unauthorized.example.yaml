$kind: http-example
request:
  url: "{{apiBaseUrl}}/auth/change-password"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "currentPassword": "{{adminPassword}}",
        "newPassword": "{{newPassword}}"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": "Bearer token required",
        "error": "Unauthorized",
        "statusCode": 401
      }
order: 6000

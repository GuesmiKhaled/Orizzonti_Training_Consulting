$kind: http-example
request:
  url: "{{apiBaseUrl}}/auth/change-password"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "currentPassword": "{{adminPassword}}",
        "newPassword": "{{newPassword}}"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": true
      }
order: 1000

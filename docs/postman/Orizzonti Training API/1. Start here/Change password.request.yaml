$kind: http-request
description: Allowed while a password change is pending. Set the collection variable `newPassword` first (at least 12 characters, different from the current one, not containing your username). Limited to 5 attempts per minute.
url: "{{apiBaseUrl}}/auth/change-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "{{adminPassword}}",
      "newPassword": "{{newPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      const json = pm.response.json();
      pm.collectionVariables.set("adminPassword", pm.collectionVariables.get("newPassword"));
      pm.collectionVariables.set("mustChangePassword", "false");
    language: text/javascript
examples: ./.resources/Change password.resources/examples
order: 6000

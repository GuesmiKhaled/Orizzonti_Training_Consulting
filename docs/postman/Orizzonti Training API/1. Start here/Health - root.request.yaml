$kind: http-request
description: Plain-text liveness check.
url: "{{apiBaseUrl}}/"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
examples: ./.resources/Health - root.resources/examples
order: 1000

$kind: http-example
request:
  url: "{{apiBaseUrl}}/course-requests/{{courseRequestId}}"
  method: PATCH
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "reviewed"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": "Course request #6 not found",
        "error": "Not Found",
        "statusCode": 404
      }
order: 2000

$kind: http-example
auth:
  type: noauth
request:
  url: "{{apiBaseUrl}}/course-requests"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "fullName": "Postman Requester",
        "email": "requester@example.com",
        "phone": "+216 21 111 111",
        "courseName": "Italian for beginners",
        "message": "Please send me the schedule."
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "id": 6,
        "fullName": "Sana Ben Ali",
        "email": "sana@example.com",
        "phone": "+216 21 111 111",
        "courseName": "Italian for beginners",
        "message": "What are the evening schedules?",
        "status": "new",
        "createdAt": "2026-10-01T09:00:00.000Z",
        "updatedAt": "2026-10-01T09:00:00.000Z"
      }
order: 1000

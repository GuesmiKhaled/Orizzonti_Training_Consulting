$kind: http-example
auth:
  type: noauth
request:
  url: "{{apiBaseUrl}}/course-requests"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "fullName": "Postman Requester",
        "email": "requester@example.com",
        "phone": "+216 21 111 111",
        "courseName": "Italian for beginners",
        "message": "Please send me the schedule."
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": [
          "email must be an email",
          "fullName should not be empty"
        ],
        "error": "Bad Request",
        "statusCode": 400
      }
order: 2000

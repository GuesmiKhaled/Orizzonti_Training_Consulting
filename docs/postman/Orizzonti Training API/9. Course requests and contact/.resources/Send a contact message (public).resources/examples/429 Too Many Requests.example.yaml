$kind: http-example
auth:
  type: noauth
request:
  url: "{{apiBaseUrl}}/contact"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "name": "Postman Visitor",
        "email": "visitor@example.com",
        "subject": "A question",
        "message": "A message of at least ten characters."
      }
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    Content-Type: application/json; charset=utf-8
    Retry-After: "60"
  body:
    type: json
    content: |-
      {
        "statusCode": 429,
        "message": "ThrottlerException: Too Many Requests"
      }
order: 4000

$kind: http-example
auth:
  type: noauth
request:
  url: "{{apiBaseUrl}}/contact"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "name": "Postman Visitor",
        "email": "visitor@example.com",
        "subject": "A question",
        "message": "A message of at least ten characters."
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Message sent successfully."
      }
order: 1000

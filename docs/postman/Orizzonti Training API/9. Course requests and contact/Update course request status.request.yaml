$kind: http-request
description: "`new`, `reviewed`, `accepted` or `rejected`."
url: "{{apiBaseUrl}}/course-requests/{{courseRequestId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "reviewed"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
examples: ./.resources/Update course request status.resources/examples
order: 4000

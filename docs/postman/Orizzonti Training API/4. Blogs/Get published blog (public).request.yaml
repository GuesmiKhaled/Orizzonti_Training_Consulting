$kind: http-request
description: A draft returns 404 here. Use "Get blog for editing" to read drafts.
url: "{{apiBaseUrl}}/blogs/{{blogId}}"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
examples: ./.resources/Get published blog (public).resources/examples
order: 2000

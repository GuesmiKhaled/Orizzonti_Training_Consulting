$kind: http-example
request:
  url: "{{apiBaseUrl}}/blogs"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "title": "Postman blog post",
        "excerpt": "A short summary of at least ten characters.",
        "content": "The article body, at least twenty characters long.",
        "slug": "postman-blog-post",
        "imageUrl": "",
        "isPublished": true
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "id": 4,
        "title": "Nursing in Italy",
        "slug": "nursing-in-italy",
        "excerpt": "What nurses need to know before moving.",
        "content": "The full article text...",
        "imageUrl": "http://localhost:5007/uploads/3f2c9a1e-5d7b-4c1a-9e0f-1b2c3d4e5f60.png",
        "isPublished": true,
        "createdAt": "2026-10-01T09:00:00.000Z",
        "updatedAt": "2026-10-01T09:00:00.000Z"
      }
order: 1000

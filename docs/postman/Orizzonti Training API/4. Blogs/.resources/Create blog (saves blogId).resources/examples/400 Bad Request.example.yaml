$kind: http-example
request:
  url: "{{apiBaseUrl}}/blogs"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "title": "Postman blog post",
        "excerpt": "A short summary of at least ten characters.",
        "content": "The article body, at least twenty characters long.",
        "slug": "postman-blog-post",
        "imageUrl": "",
        "isPublished": true
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": [
          "title must be longer than or equal to 3 characters",
          "excerpt must be longer than or equal to 10 characters"
        ],
        "error": "Bad Request",
        "statusCode": 400
      }
order: 2000

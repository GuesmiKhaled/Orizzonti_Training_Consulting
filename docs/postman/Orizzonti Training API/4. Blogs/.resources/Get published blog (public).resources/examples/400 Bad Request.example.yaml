$kind: http-example
auth:
  type: noauth
request:
  url: "{{apiBaseUrl}}/blogs/{{blogId}}"
  method: GET
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": "Validation failed (numeric string is expected)",
        "error": "Bad Request",
        "statusCode": 400
      }
order: 3000

$kind: http-request
url: "{{apiBaseUrl}}/blogs"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Postman blog post",
      "excerpt": "A short summary of at least ten characters.",
      "content": "The article body, at least twenty characters long.",
      "slug": "postman-blog-post",
      "imageUrl": "",
      "isPublished": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      const json = pm.response.json();
      pm.collectionVariables.set("blogId", json.id);
    language: text/javascript
examples: ./.resources/Create blog (saves blogId).resources/examples
order: 5000

$kind: http-request
description: Add `password` to replace the stored one; leave it out (or empty) to keep it. Unknown fields return 400.
url: "{{apiBaseUrl}}/settings/mail"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "host": "smtp.example.com",
      "port": 587,
      "username": "info@orizzonti.tn",
      "fromAddress": "info@orizzonti.tn",
      "secure": true
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
examples: ./.resources/Update mail settings.resources/examples
order: 4000

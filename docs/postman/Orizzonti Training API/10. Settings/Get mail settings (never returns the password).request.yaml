$kind: http-request
description: "The password is write-only: `passwordConfigured` tells whether one is stored."
url: "{{apiBaseUrl}}/settings/mail"
method: GET
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
examples: ./.resources/Get mail settings (never returns the password).resources/examples
order: 3000

$kind: http-example
request:
  url: "{{apiBaseUrl}}/settings/mail"
  method: PATCH
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "host": "smtp.example.com",
        "port": 587,
        "username": "info@orizzonti.tn",
        "fromAddress": "info@orizzonti.tn",
        "secure": true
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": [
          "port must not be greater than 65535"
        ],
        "error": "Bad Request",
        "statusCode": 400
      }
order: 2000

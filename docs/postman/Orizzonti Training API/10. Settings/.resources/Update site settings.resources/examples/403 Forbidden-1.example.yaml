$kind: http-example
name: 403 Forbidden
request:
  url: "{{apiBaseUrl}}/site-settings"
  method: PATCH
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "heroTitle": "Learn with Orizzonti",
        "heroSubtitle": "Classes in Tunis for every level.",
        "contactEmail": "info@orizzonti.tn",
        "contactPhone": "+216 24 422 753",
        "facebookUrl": "https://www.facebook.com/orizzonti.tn",
        "aboutText": "First paragraph.\n\nSecond paragraph.",
        "studentsCount": 2500,
        "coursesCount": 12,
        "yearsOfExperience": 15,
        "nextSessionDate": "2026-11-01T09:00:00.000Z"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": "Password change required",
        "error": "Forbidden",
        "statusCode": 403
      }
order: 4000

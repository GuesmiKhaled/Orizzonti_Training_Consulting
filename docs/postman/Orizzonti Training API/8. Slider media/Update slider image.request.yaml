$kind: http-request
url: "{{apiBaseUrl}}/media/{{mediaId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "isActive": false
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
examples: ./.resources/Update slider image.resources/examples
order: 5000

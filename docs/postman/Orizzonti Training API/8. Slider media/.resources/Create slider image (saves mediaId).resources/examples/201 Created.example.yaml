$kind: http-example
request:
  url: "{{apiBaseUrl}}/media"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "title": "Postman slide",
        "imageUrl": "{{uploadedUrl}}",
        "altText": "Describes the image for screen readers",
        "isActive": true
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "id": 7,
        "title": "Classroom",
        "imageUrl": "http://localhost:5007/uploads/3f2c9a1e-5d7b-4c1a-9e0f-1b2c3d4e5f60.png",
        "altText": "Students in our classroom",
        "isActive": true,
        "createdAt": "2026-10-01T09:00:00.000Z",
        "updatedAt": "2026-10-01T09:00:00.000Z"
      }
order: 1000

$kind: http-example
request:
  url: "{{apiBaseUrl}}/media/upload"
  method: POST
  body:
    type: formdata
    content:
      - type: file
        key: file
        src: []
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": "Insufficient permission",
        "error": "Forbidden",
        "statusCode": 403
      }
order: 6000

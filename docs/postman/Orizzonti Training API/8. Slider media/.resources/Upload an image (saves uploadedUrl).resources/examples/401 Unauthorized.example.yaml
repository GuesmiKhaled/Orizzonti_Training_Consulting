$kind: http-example
request:
  url: "{{apiBaseUrl}}/media/upload"
  method: POST
  body:
    type: formdata
    content:
      - type: file
        key: file
        src: []
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": "Bearer token required",
        "error": "Unauthorized",
        "statusCode": 401
      }
order: 5000

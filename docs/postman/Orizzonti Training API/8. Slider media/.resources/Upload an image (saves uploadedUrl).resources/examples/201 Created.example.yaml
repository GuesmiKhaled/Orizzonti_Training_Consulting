$kind: http-example
request:
  url: "{{apiBaseUrl}}/media/upload"
  method: POST
  body:
    type: formdata
    content:
      - type: file
        key: file
        src: []
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "url": "http://localhost:5007/uploads/3f2c9a1e-5d7b-4c1a-9e0f-1b2c3d4e5f60.png"
      }
order: 1000

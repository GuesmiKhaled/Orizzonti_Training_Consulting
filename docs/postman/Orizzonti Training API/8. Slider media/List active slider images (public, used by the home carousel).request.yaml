$kind: http-request
description: Active images only, newest first. Every image you add appears in the home page carousel.
url: "{{apiBaseUrl}}/media"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
examples: ./.resources/List active slider images (public, used by the home carousel).resources/examples
order: 1000

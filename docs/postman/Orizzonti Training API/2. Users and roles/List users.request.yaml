$kind: http-request
description: Paged. `search` matches username, full name and email; `roleId` filters by role (leave empty for all).
url: "{{apiBaseUrl}}/auth/users?page=0&size=10&search=&roleId="
method: GET
queryParams:
  page: "0"
  size: "10"
  search: ""
  roleId: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test("Paged result", () => pm.expect(json).to.have.keys("items", "total", "page", "size"));
    language: text/javascript
examples: ./.resources/List users.resources/examples
order: 1000

$kind: http-example
request:
  url: "{{apiBaseUrl}}/auth/users"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "username": "postman-user",
        "password": "a-temporary-password-1",
        "roleId": "{{superAdminRoleId}}",
        "fullName": "Postman User",
        "email": "postman@example.com",
        "phone": "+216 20 000 000",
        "isActive": true
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": "Username already exists",
        "error": "Conflict",
        "statusCode": 409
      }
order: 2000

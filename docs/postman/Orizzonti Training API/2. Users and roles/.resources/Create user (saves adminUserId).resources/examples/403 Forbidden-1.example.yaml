$kind: http-example
name: 403 Forbidden
request:
  url: "{{apiBaseUrl}}/auth/users"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "username": "postman-user",
        "password": "a-temporary-password-1",
        "roleId": "{{superAdminRoleId}}",
        "fullName": "Postman User",
        "email": "postman@example.com",
        "phone": "+216 20 000 000",
        "isActive": true
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": "Password change required",
        "error": "Forbidden",
        "statusCode": 403
      }
order: 5000

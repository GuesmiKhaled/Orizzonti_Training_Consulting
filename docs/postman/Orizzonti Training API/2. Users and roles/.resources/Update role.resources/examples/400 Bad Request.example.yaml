$kind: http-example
request:
  url: "{{apiBaseUrl}}/auth/roles/{{testRoleId}}"
  method: PATCH
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "description": "Updated description"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": "The super-admin role name is reserved",
        "error": "Bad Request",
        "statusCode": 400
      }
order: 3000

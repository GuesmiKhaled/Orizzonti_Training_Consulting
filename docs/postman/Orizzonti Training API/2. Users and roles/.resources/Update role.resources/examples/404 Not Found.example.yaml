$kind: http-example
request:
  url: "{{apiBaseUrl}}/auth/roles/{{testRoleId}}"
  method: PATCH
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "description": "Updated description"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": "Role not found",
        "error": "Not Found",
        "statusCode": 404
      }
order: 2000

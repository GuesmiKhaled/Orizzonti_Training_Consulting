$kind: http-example
request:
  url: "{{apiBaseUrl}}/auth/roles"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "name": "postman-role",
        "description": "Temporary role",
        "permissionIds": [
          "{{permissionIdManageBlog}}"
        ]
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": [
          "permissionIds must contain at least 1 elements"
        ],
        "error": "Bad Request",
        "statusCode": 400
      }
order: 3000

$kind: http-request
url: "{{apiBaseUrl}}/auth/roles/{{testRoleId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "description": "Updated description"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
examples: ./.resources/Update role.resources/examples
order: 8000

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets (chunks, scripts, styles) — immutable, long cache.
    # Return 404 for missing files instead of falling back to index.html,
    # so the browser does not receive HTML with a JS MIME mismatch.
    location ~* \.(?:js|mjs|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico|wasm)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # Runtime config generated by the entrypoint — must not be cached.
    location = /runtime-config.js {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Content-Type-Options nosniff;
    }

    # SPA fallback for client-side routes (only for HTML navigation, not assets).
    location / {
        try_files $uri $uri/ /index.html;
    }
}

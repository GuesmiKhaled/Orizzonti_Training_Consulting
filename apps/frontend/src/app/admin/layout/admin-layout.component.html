<div class="shell" [class.sidebar-collapsed]="!sidebarOpen()">
  <app-admin-sidebar
    class="sidebar"
    [items]="nav()"
    [collapsed]="!sidebarOpen()"
    (navigated)="closeSidebar()"
  />

  @if (sidebarOpen()) {
    <button
      type="button"
      class="backdrop"
      aria-label="Close navigation"
      (click)="closeSidebar()"
    ></button>
  }

  <div class="main">
    <app-admin-topbar
      [userLabel]="userLabel()"
      [sidebarOpen]="sidebarOpen()"
      (menuToggled)="toggleSidebar()"
      (loggedOut)="logout()"
    />
    <main class="content">
      <app-admin-breadcrumbs />
      <router-outlet />
    </main>
  </div>
</div>

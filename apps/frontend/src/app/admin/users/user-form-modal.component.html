<app-modal-shell
  [title]="user() ? 'Edit user' : 'Add user'"
  [closeOnBackdrop]="false"
  (closed)="closed.emit()"
>
  <form class="grid" [formGroup]="form" (ngSubmit)="save()" id="user-form">
    <app-form-field label="Username" [required]="true" [error]="error('username')">
      <input formControlName="username" autocomplete="off" />
    </app-form-field>
    <app-form-field label="Full name">
      <input formControlName="fullName" autocomplete="off" />
    </app-form-field>
    <app-form-field label="Email" [error]="error('email')">
      <input type="email" formControlName="email" autocomplete="off" />
    </app-form-field>
    <app-form-field label="Phone" [error]="error('phone')">
      <input formControlName="phone" inputmode="tel" autocomplete="off" />
    </app-form-field>
    <app-form-field
      [label]="user() ? 'New password (optional)' : 'Password'"
      [required]="!user()"
      [error]="error('password')"
      hint="At least 8 characters"
    >
      <input type="password" formControlName="password" autocomplete="new-password" />
    </app-form-field>
    <app-form-field label="Role" [required]="true" [error]="error('roleId')">
      <select formControlName="roleId">
        <option [ngValue]="null">Choose a role</option>
        @for (role of roles(); track role.id) {
          <option [ngValue]="role.id">{{ role.name }}</option>
        }
      </select>
    </app-form-field>
    <label class="check span-2">
      <input type="checkbox" formControlName="isActive" />
      Active (can sign in)
    </label>
  </form>

  <ng-container modal-footer>
    <button type="button" class="btn btn-ghost" [disabled]="saving()" (click)="closed.emit()">
      Cancel
    </button>
    <button type="submit" form="user-form" class="btn btn-primary" [disabled]="saving()">
      {{ saving() ? 'Saving...' : user() ? 'Save user' : 'Create user' }}
    </button>
  </ng-container>
</app-modal-shell>
